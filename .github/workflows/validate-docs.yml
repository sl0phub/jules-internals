name: Validate docs

# Untrusted. For a same-repo branch -- which is how Jules opens pull requests --
# GitHub runs this file from the PR head, so a pull request can edit it. That is
# why it gets a read-only token and no secrets, and why it is NOT the gate:
# jules-automerge.yml (on: workflow_run, always main's copy) is.

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Dependencies always come from main, never from the pull request.
      - name: Install dependencies from main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:requirements.txt > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt"
      - name: Build check
        run: mkdocs build --strict
